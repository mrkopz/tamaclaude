<!-- เหรียญที่เราไม่รู้จัก — จานเปล่า ไม่มีตัวอักษรข้างใน

     ตัวอักษรแรกของสัญลักษณ์ (`P` ของ PEPE) เป็นสิ่งที่ถูกปฏิเสธ: มันนั่งห่างจากคำว่า
     PEPE ที่พิมพ์เต็มไป 8px แล้วไม่เพิ่มข้อมูลสักบิต — กฎเดียวกับที่แถบบนใช้ ห้ามพูดซ้ำ

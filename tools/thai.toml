# ตารางเลือกร่าง glyph ภาษาไทย — แหล่งความจริงเดียวของทั้ง Swift และ Python
#
# LVGL วาดทีละ codepoint เรียงไปทางขวา ไม่มี GPOS จึงจัดวางสระบนและวรรณยุกต์เองไม่ได้
# (ADR-0008) daemon เป็นคนเดินคลัสเตอร์แล้วเลือก "ร่าง" ของ mark เอง ร่างที่ไม่ใช่ร่าง
# ปกติอยู่ใน PUA และมีอยู่จริงในฟอนต์เพราะ tools/export_thai_font.py วาดมันจาก glyph
# เดิมโดยเลื่อนตำแหน่ง ตัวเลขในไฟล์นี้จึงเป็น "ข้อมูล" จริงๆ: แก้แล้วดูผลได้จาก
# preview.py โดยไม่ต้องแฟลชบอร์ด
#
# แก้ไฟล์นี้แล้วต้องรัน:
#     python3 tools/export_thai.py        -> ตารางฝั่ง Swift และ Python
#     python3 tools/export_thai_font.py   -> ฟอนต์ฝั่ง firmware และฝั่ง preview

[font]
# ขนาดที่แปลงลง firmware — 12 คือตัวเนื้อ 14 คือหัวเรื่อง (ดู ct_ui.c)
sizes = [12, 14]
# ระยะก้าวของพยัญชนะไทยทุกตัวถูกบังคับให้เท่ากันที่ขนาดนี้ เพราะ mark มีระยะก้าว 0
# และวางด้วย ofs_x ค่าเดียวต่อร่าง ถ้าฐานกว้างไม่เท่ากัน วรรณยุกต์จะเลื่อนตามฐานไม่ได้
# (LVGL ไม่มี anchor ต่อคู่) ผลคือช่องไฟหลวมขึ้นเล็กน้อยแลกกับตำแหน่ง mark ที่ตรงเป๊ะ
advance = { 12 = 8, 14 = 9 }
source = "fonts/Sarabun-Regular.ttf"
# ร่างที่สร้างเพิ่มถูกวางไว้ใน Private Use Area เรียงตามลำดับใน [[variant]]
pua_start = 0xF700

[block]
# ช่วงอักขระไทยที่ sanitize ยอมให้ผ่าน — นอกช่วงนี้ยังถูกทิ้งเหมือนเดิม
# 0E3B..0E3E ไม่มีอักขระใน Unicode จึงไม่อยู่ในช่วง
ranges = [[0x0E01, 0x0E3A], [0x0E3F, 0x0E5B]]

[base]
# ฐานหางสูง — เส้นตั้งด้านขวาชนกับ mark ที่วางตรงกลาง ต้องเลื่อน mark ไปทางซ้าย
tall = ["ป", "ฝ", "ฟ", "ฬ"]
# ฐานหางยาวลงล่าง — สระล่างต้องหลบหาง
descender = ["ญ", "ฐ"]

[mark]
# สระบน: กินความสูงชั้นแรกเหนือฐาน วรรณยุกต์ที่ตามมาต้องขึ้นไปอยู่ชั้นสอง
above = ["ั", "ิ", "ี", "ึ", "ื", "็", "ํ", "๎"]
# วรรณยุกต์และทัณฑฆาต: อยู่ชั้นบนสุดเสมอ
tone = ["่", "้", "๊", "๋", "์"]
# สระล่าง
below = ["ุ", "ู", "ฺ"]

# ---------------------------------------------------------------------------
# ร่างที่ไม่ใช่ร่างปกติ — `shift` คือระยะเลื่อนเป็นพิกเซล [dx, dy] ต่อขนาดฟอนต์
# dy ติดลบ = ขึ้นบน, dy บวก = ลงล่าง
#
# `context` ที่ shaper รู้จัก:
#   tall       ฐานเป็นตัวหางสูง
#   high       มีสระบนอยู่แล้ว (ใช้กับวรรณยุกต์เท่านั้น)
#   tall_high  ทั้งสองอย่าง
#   descender  ฐานเป็นตัวหางยาว (ใช้กับสระล่างเท่านั้น)
# ---------------------------------------------------------------------------

[[variant]]
name = "above_tall"
class = "above"
context = "tall"
shift = { 12 = [-2, 0], 14 = [-2, 0] }

[[variant]]
name = "tone_tall"
class = "tone"
context = "tall"
shift = { 12 = [-2, 0], 14 = [-2, 0] }

[[variant]]
name = "tone_high"
class = "tone"
context = "high"
shift = { 12 = [0, -4], 14 = [0, -5] }

[[variant]]
name = "tone_tall_high"
class = "tone"
context = "tall_high"
shift = { 12 = [-2, -4], 14 = [-2, -5] }

[[variant]]
name = "below_descender"
class = "below"
context = "descender"
shift = { 12 = [0, 3], 14 = [0, 4] }
